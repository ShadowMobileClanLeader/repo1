[project]
name = "health-dashboard"
version = "0.1.0"
description = "Private, local health dashboard from Garmin data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
hd = "hd.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
