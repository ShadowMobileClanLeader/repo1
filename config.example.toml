# Copy to config.toml (which git ignores) and fill in what applies.

# Profile — used for the daily energy estimate. Values here override the Garmin export.
# height_cm = 180
# birth_date = 1986-04-02
# sex = "male"            # "male" or "female" (the resting-burn formula needs one)

# Health trend: what counts as "better" for weight — "maintain", "lose" or "gain"
weight_goal = "maintain"

# Sleep target band in hours
sleep_band_h = [7, 9]

# Heart-rate band (bpm) for the "easy-run pace" chart
easy_hr_band = [140, 150]
